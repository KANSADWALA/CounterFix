[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "counterfix"
version = "0.2.1"
description = "Find out why an LLM call failed, and prove the fix works: a one-line wrapper that diagnoses failures and verifies fixes by re-running them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shubham Kansadwala" }]
keywords = ["llm", "reliability", "debugging", "root-cause", "hallucination", "evaluation", "counterfactual", "openai", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "jsonschema>=4.20",
  "json-repair>=0.30",
  "tenacity>=8.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
litellm = ["litellm>=1.50"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
otel = ["opentelemetry-sdk>=1.27"]
semantic = [
  "transformers>=4.44",
  "torch>=2.2",
  "sentence-transformers>=3.0",
  "bert-score>=0.3.13",
]
metrics = ["sacrebleu>=2.4"]
eval = ["pyyaml>=6.0"]
code = ["evalplus>=0.3.1"]
benchmarks = ["datasets>=2.18", "lm-eval[ifeval]>=0.4.8"]
safety = ["detoxify>=0.5", "presidio-analyzer>=2.2; python_version >= '3.11'"]
cache = ["diskcache>=5.6"]
cli = ["typer>=0.12", "rich>=13.7"]
report = ["jinja2>=3.1"]
jev = ["typesafe-sdk>=0.7"]
mcp = ["mcp>=2.0"]
# Bundles. "evals": dataset runner, metrics and benchmarks (not the heavy torch or safety
# models, which stay in "semantic" and "safety"). "all": every integration and feature.
evals = ["counterfix[eval,metrics,code,benchmarks,report,cli]"]
all = [
  "counterfix[openai,anthropic,litellm,langchain,llamaindex,otel,mcp,cache]",
  "counterfix[evals,semantic,safety]",
]
docs = ["mkdocs-material>=9.5"]
dev = [
  "pytest>=8.0",
  "pytest-recording>=0.13",
  "ruff==0.17.0",  # pinned: CI must format and lint exactly like local runs
  "mypy==2.4.0",
  "import-linter==2.15",  # layer check: lint-imports
  "types-jsonschema",
  "sacrebleu>=2.4",
  "rouge-score>=0.1.2",
]

[project.scripts]
counterfix = "counterfix.cli:main"

[project.entry-points.pytest11]
counterfix = "counterfix.testing"

[project.urls]
Homepage = "https://github.com/KANSADWALA/CounterFix"
Documentation = "https://kansadwala.github.io/CounterFix/"
Changelog = "https://github.com/KANSADWALA/CounterFix/blob/main/CHANGELOG.md"
Issues = "https://github.com/KANSADWALA/CounterFix/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/counterfix"]

# Only these files go into the source upload on PyPI (never .env, bench data or local files).
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"bench/make_seed.py" = ["E501"]  # prompt text is data
"bench/make_rag_seed.py" = ["E501"]  # passage text is data
"bench/make_rag_holdout.py" = ["E501"]
"bench/lm_eval_parity.py" = ["E501"]
"bench/dev_walkthrough.py" = ["E501"]  # dataset rows are data
"bench/make_injection_seed.py" = ["E501"]
"bench/eval_injection.py" = ["E501"]
"src/counterfix/benchmarks/injection.py" = ["E501"]
"src/counterfix/benchmarks/tool_use.py" = ["E501"]
"bench/make_agent_seed.py" = ["E501"]
"bench/eval_agents.py" = ["E501"]
"bench/make_metric_seed.py" = ["E501"]
"bench/eval_metrics.py" = ["E501"]
"bench/spot_check.py" = ["E501"]
"tests/test_agents.py" = ["E501"]
# re-exports: eager ones for the core loop, the rest only for type checkers (loaded lazily)
"src/counterfix/__init__.py" = ["F401"]
# non-ASCII punctuation, spaces and quotes are what these modules look for
"src/counterfix/_internal/text.py" = ["RUF001"]
"src/counterfix/detect/instructions.py" = ["RUF001"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["counterfix"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openai", "openai.*", "anthropic", "anthropic.*", "typesafe_sdk", "typesafe_sdk.*", "litellm.*", "langchain_core.*",
  "opentelemetry", "opentelemetry.*", "mcp", "mcp.*", "sacrebleu", "sentence_transformers",
  "bert_score", "yaml", "rouge_score", "rouge_score.*", "evalplus", "evalplus.*",
  "lm_eval", "lm_eval.*", "datasets", "torch", "torch.*", "transformers", "transformers.*",
  "detoxify", "presidio_analyzer", "presidio_analyzer.*",
]
ignore_missing_imports = true

# The frameworks are optional: installed locally, missing in CI, so the ignores differ.
[[tool.mypy.overrides]]
module = ["counterfix.adapters.callbacks"]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Layers, highest first: a module may import only from layers below it. Run `lint-imports`.
# Matches the target layout in the restructure plan, spelled with today's module names.
[tool.importlinter]
root_package = "counterfix"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers: entry points > evaluation > integrations > fixes > detection > judges > core"
type = "layers"
layers = [
  "counterfix.__main__",
  "counterfix.cli",
  "counterfix.mcp_server",
  "counterfix.benchmarks",
  "counterfix.evals | counterfix.testing | counterfix.profiles",
  "counterfix.metrics",
  "counterfix.safety | counterfix.perplexity | counterfix.capabilities",
  "counterfix.otel",
  "counterfix.adapters",
  "counterfix.background",
  "counterfix.report",
  "counterfix.perf",
  "counterfix.engine",
  "counterfix.verify",
  "counterfix.diagnose",
  "counterfix.lint | counterfix.context",
  "counterfix.detect",
  "counterfix.judges",
  "counterfix.presets",
  "counterfix.rules",
  "counterfix._profile_store",
  "counterfix.core",
  "counterfix._internal",
]
ignore_imports = [
  # The metric registry knows three benchmark scorers by name (``--metric ifeval``).
  # Both packages move under counterfix.evals in the restructure, which ends this.
  "counterfix.metrics -> counterfix.benchmarks.*",
]
