# Copy to .github/workflows/drift.yml in your repo, and add your keys as repository secrets.
# Every Monday it re-runs counterfix's probe suite on your model and fails the job when a
# task's failure rate moved 15 points or more since the stored profile (committed below).
name: Model drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COUNTERFIX_HOME: ${{ github.workspace }}/.counterfix   # profiles live in the repo
      MODEL: groq:qwen/qwen3.8-27b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "counterfix[openai]"
      - name: First run only - measure the model
        run: test -d .counterfix/profiles || counterfix profile "$MODEL" --judge
      - name: Check for drift
        run: counterfix drift "$MODEL" --judge
      - name: Keep the new profile
        if: always()
        run: |
          git config user.name "drift bot"
          git config user.email "drift-bot@users.noreply.github.com"
          git add .counterfix && git commit -m "Model profile update" && git push || true
