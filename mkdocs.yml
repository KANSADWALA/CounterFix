site_name: counterfix
site_description: LLM evaluation that diagnoses failures and re-runs fixes to see which ones work.
site_url: https://kansadwala.github.io/CounterFix/
repo_url: https://github.com/KANSADWALA/CounterFix
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - Guide:
      - Plug it in: plugs.md
      - Diagnose a call: diagnose.md
      - Verified fixes: fixes.md
      - Evaluate a dataset: evals.md
      - RAG evaluation: rag.md
      - Code evaluation: code.md
      - Benchmarks: benchmarks.md
      - Safety and injection: safety.md
      - Agents and tool calls: agents.md
      - Confidence and perplexity: confidence.md
      - Speed and cost: speed.md
      - In production: production.md
      - Prompt regression tests: testing.md
      - Model profiles: profiles.md
      - Prompt linter: lint.md
      - MCP server: mcp.md
      - Command line: cli.md
  - Failure types:
      - F1 Truncation: failures/F1.md
      - F2 Format break: failures/F2.md
      - F3 Over-refusal: failures/F3.md
      - F4 Hallucination: failures/F4.md
      - F5 False premise: failures/F5.md
      - F6 Dropped instruction: failures/F6.md
      - F7 Prompt fragility: failures/F7.md
      - F8 Computation error: failures/F8.md
      - F9 Ambiguous request: failures/F9.md
      - F10 Retrieval miss: failures/F10.md
      - F11 Context ignored: failures/F11.md
      - F12 Code fails its tests: failures/F12.md
      - F13 Prompt injection: failures/F13.md
      - F14 Tool misuse: failures/F14.md
  - Measured results: results.md
