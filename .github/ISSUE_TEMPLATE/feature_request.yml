name: Feature request
description: A new check, fix, provider plug or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The failure you want caught or fixed, or the stack you want supported.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
